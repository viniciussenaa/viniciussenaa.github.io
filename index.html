<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia 🤍✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #4a5d4c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Fira Code', monospace;
            overflow: hidden;
        }

        h2, h3 {
            color: white;
            font-family: 'Fira Code', monospace;
            text-align: center;
            margin: 10px 0;
        }

        h2 {
            font-size: 2em;
            
        }

        h3 {
            font-size: 1.5em;
            margin-bottom: 111px;
        }

        /* Texto acima dos emojis */
        h5 {
            color: white;
            font-family: 'Fira Code', monospace;
            font-size: 1.2em;
            text-align: center;
            margin: 10px 0;
        }
        .emoji-button {
            font-size: 5em;
            cursor: pointer;
            transition: opacity 0.5s;
            margin: 10px;
            position: relative;
        }
        .letter-container {
            display: none;
            width: 60vw;
            max-width: 105mm;
            height: calc(60vw * 1.414);
            max-height: 148mm;
            background: #f8f8f8;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: grow 0.5s forwards;
            text-align: center;
        }
        .letter-content {
            font-family: 'Fira Code', monospace !important;
            font-size: 12px;
            line-height: 1.5;
            color: black !important;
            text-align: left;
        }
        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4a5d4c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .back-button:hover {
            background-color: #3b4b3c;
        }
        @media (max-width: 600px) {
            .letter-container {
                width: 80vw;
                height: calc(80vw * 1.414);
            }
        }
        @keyframes grow {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .emoji {
            position: absolute;
            font-size: 2em;
            animation: explode 3s ease-out forwards;
        }
        /* Animação de explosão */
        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <h2>Feliz Dia da Mulher! ❤️</h2>
    <h3>Feliz nosso dia! 🤍✨</h3>

    <!-- Texto acima do emoji de carta -->
    <h5>Primeiro, abra esta:</h5>
    <div class="emoji-button" onclick="openLetter('letter')">✉️</div>

    <!-- Texto acima do emoji de presente -->
    <h5>Já leu a de cima? Agora sim, pode abrir</h5>
    <div class="emoji-button" onclick="openLetter('gift')">🎁</div>
    
    <div class="letter-container" id="letterContainer">
        <div class="letter-content" id="letterContent">
        </div>
        <button class="back-button" onclick="closeLetter()">Voltar</button>
    </div>

    <script>
        function openLetter(type) {
            document.querySelectorAll('.emoji-button').forEach(emoji => {
                emoji.style.opacity = '0';
                setTimeout(() => {
                    emoji.style.display = 'none';
                }, 500);
            });
            
            const letterContainer = document.getElementById('letterContainer');
            const letterContent = document.getElementById('letterContent');
            
            if (type === 'letter') {
                letterContent.innerHTML = `
                <p>Hellooo, mi amorrr 🤍</p>

            <p>Como que tá o amorzão da minha vida?</p>
            <p>Senti de te escrever uma poesia.<p>
            
            Como não começar falando do seu sorriso?<br>
            Ah! Seu sorriso ilumina mais que o dia,<br>
            E o seu olhar, brilha mais que a lua iluminando à noite.<br><br>
            
            Teu jeito de falar transmite leveza e calma,<br>
            É um som de amor e paz, a mais pura beleza.<br>
            Te ouvir é como ouvir a mais bela canção,<br>
            Que embala meu peito e aquece o meu coração.<br><br>
            
            Sua inteligência me inspira e me atrai, <br>
            A cada conversa que temos, sempre aprendo mais. <br>
            Seu bom humor me contagia, <br>
            Estar ao seu lado é a certeza da alegria. <br><br>
            
            O seu jeito de ser<br>
            me encanta e me fascina.<br>
            És como a joia mais rara, a flor mais linda,<br>
            tens um brilho único, um encanto que predomina.<br><br>
            
            Admiro sua força, sua garra e coragem;<br>
            ver cada detalhe seu é como admirar a mais bela paisagem.<br>
            Você me tira o ar, acelera meu coração,<br>
            e a única certeza que tenho é que quero viver a vida ao seu lado.<br><br>
            
            Amo você muitão! 🤍<br>
            
            <p>Com amor e carinho,<br>Vini.</p>`;
            } else if (type === 'gift') {
                letterContent.innerHTML = `
                    <p>Surpresa, meu amor! 🎁</p>
                    <p>Esse presente é só um pequeno gesto para te lembrar o quanto você é especial para mim.</p>
                    <p>Te amo imensamente! 💖</p>
                    <p>Clique <a href="https://drive.google.com/uc?export=download&id=1UYf9MmpCM8x59mSKEX3KY7Y815lILZYs" target="_blank">aqui</a> para ver o presente!</p>`;
            }
            
            letterContainer.style.display = 'block';
            letterContainer.style.animation = 'grow 0.5s forwards';

            // Chama a função para adicionar os emojis
            addEmojis();
        }

        function closeLetter() {
            const letterContainer = document.getElementById('letterContainer');
            letterContainer.style.display = 'none';
            
            document.querySelectorAll('.emoji-button').forEach(emoji => {
                emoji.style.display = 'block';
                setTimeout(() => {
                    emoji.style.opacity = '1';
                }, 100);
            });
        }

        function addEmojis() {
            const emojis = ['❤️', '💖', '💝', '💕'];
            const letterContainer = document.getElementById('letterContainer');
            const rect = letterContainer.getBoundingClientRect();
            for (let i = 0; i < 20; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'emoji';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.style.left = `${rect.left + rect.width / 2}px`;
                emoji.style.top = `${rect.top + rect.height / 2}px`;
                emoji.style.setProperty('--x', `${Math.random() * window.innerWidth - window.innerWidth / 2}px`);
                emoji.style.setProperty('--y', `${Math.random() * window.innerHeight - window.innerHeight / 2}px`);
                document.body.appendChild(emoji);
                setTimeout(() => {
                    emoji.remove();
                }, 4000);
            }
        }
    </script>
</body>
</html>
